server {
  listen 8888;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 500m;

  location /api/surfing/ {
    proxy_pass http://surfing-service.surfing-service-system.svc.cluster.local:10023/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Prefer inbound X-Forwarded-Proto (edge TLS); fall back to https for this app.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    # Auth callback Set-Cookie can be large; default 4k/8k buffers yield HTML 502.
    proxy_buffer_size 16k;
    proxy_buffers 4 16k;
    proxy_busy_buffers_size 32k;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  location = /sitemap.xml {
    try_files /sitemap.xml =404;
    default_type application/xml;
  }

  location = /robots.txt {
    try_files /robots.txt =404;
    default_type text/plain;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

