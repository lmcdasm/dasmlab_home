name: Dasmlab Home CX Pipeline (Buildah - Daemonless)

on:
  push:
    branches: ["main", "2026-spring-FE-update", "development"]
  workflow_dispatch:
    inputs:
      cluster_type:
        description: 'Cluster type (ocp or k3s)'
        required: false
        default: 'ocp'
        type: choice
        options:
          - ocp
          - k3s

jobs:
  cx-pipeline:
    runs-on: [self-hosted, Linux, X64, k8s-runner]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Build Metadata
        id: vars
        run: |
          echo "COMMIT_ID=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "VERSION_TAG=v$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          # Image tag is now set by kaniko destination
          echo "COUNTER_FULL_PATH=${{ vars.COUNTER_FULL_PATH }}" >> $GITHUB_ENV
          echo "COUNTER_API_TOKEN=${{ vars.COUNTER_API_TOKEN }}" >> $GITHUB_ENV
          echo "COUNTER_COUNTER_SLUG=${{ vars.COUNTER_COUNTER_SLUG }}" >> $GITHUB_ENV
          echo "COUNTER_WORKSPACE=${{ vars.WORKSPACE }}" >> $GITHUB_ENV

      - name: Verify Buildah
        run: |
          # Buildah should already be installed in the runner image
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:${PATH}"
          
          if ! command -v buildah &> /dev/null; then
            echo "ERROR: buildah command not found!"
            exit 1
          fi
          buildah --version
          echo "Buildah is ready!"

      - name: Build Phase
        env:
          GHCR_TOKEN: ${{ secrets.DASMLAB_GHCR_PAT }}
        run: |
          # Ensure PATH includes standard directories
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:${PATH}"
          
          # Verify we can use sudo
          echo "Current user: $(whoami)"
          echo "Testing sudo access..."
          sudo whoami || (echo "ERROR: Cannot use sudo!" && exit 1)
          
          # Verify token is set
          if [ -z "${GHCR_TOKEN}" ]; then
            echo "ERROR: GHCR_TOKEN is not set!"
            exit 1
          fi
          echo "Token length: ${#GHCR_TOKEN} characters"
          
          # Login to GHCR first (before build, so it can pull base images if needed)
          echo "Logging in to GHCR..."
          echo "${GHCR_TOKEN}" | sudo buildah login --username lmcdasm --password-stdin ghcr.io || (echo "ERROR: buildah login failed!" && exit 1)
          echo "Login successful!"
          
          # Verify Dockerfile exists
          if [ ! -f Dockerfile ]; then
            echo "ERROR: Dockerfile not found in current directory"
            ls -la
            exit 1
          fi
          
          # Build with buildah (daemonless, no Docker needed)
          # Use sudo since we're running as runner user but container is root
          sudo buildah build \
            --build-arg COUNTER_FULL_PATH="$COUNTER_FULL_PATH" \
            --build-arg COUNTER_API_TOKEN="$COUNTER_API_TOKEN" \
            --build-arg COUNTER_COUNTER_SLUG="$COUNTER_COUNTER_SLUG" \
            --build-arg COUNTER_WORKSPACE="$COUNTER_WORKSPACE" \
            --build-arg APP_VERSION="$VERSION_TAG" \
            -t ghcr.io/lmcdasm/dasmlab-home:${VERSION_TAG} \
            -f Dockerfile \
            .
          
          # Push the image
          sudo buildah push ghcr.io/lmcdasm/dasmlab-home:${VERSION_TAG}

      - name: Run Phase (App Container Test)
        run: |
          # Buildah builds and pushes to registry
          echo "Container image built and pushed successfully with Buildah"

      - name: Secure Phase (Stub)
        run: |
          echo "Run SAST/DAST tools here (stub - can be implemented later)"
          exit 0

      - name: Test Phase (Stub)
        run: |
          echo "Run Selenium/Playwright/etc tests here (stub - can be implemented later)"
          exit 0

      - name: Publish Phase
        run: |
          # Buildah already pushes during build phase
          echo "Image published to ghcr.io/lmcdasm/dasmlab-home:${VERSION_TAG}"

      - name: GitOps Sync (Deploy) Phase
        env:
          # Default to 'ocp' since cluster is now OpenShift
          # Can override via workflow_dispatch input if needed
          CLUSTER_TYPE: ${{ inputs.cluster_type || 'ocp' }}
        run: |
          # Determine which manifest to use based on CLUSTER_TYPE (default: ocp)
          # Can be set via workflow_dispatch input or environment variable
          if [ "$CLUSTER_TYPE" = "ocp" ]; then
            MANIFEST_SOURCE="k8s_envelope/dasmlab-home_deploy-ocp.yaml"
            echo "Using OCP manifest for OpenShift deployment"
          else
            MANIFEST_SOURCE="k8s_envelope/dasmlab-home_deploy.yaml"
            echo "Using k3s manifest for k3s deployment"
          fi
          
          sed "s|__VERSION__|${VERSION_TAG}|g" "$MANIFEST_SOURCE" > generated.yaml

          git config --global user.name "dasmlab-bot"
          git config --global user.email "ci@dasmlab.org"

          git clone https://x-access-token:${{ secrets.DASMLAB_GHCR_PAT }}@github.com/lmcdasm/dasmlab-live-cicd.git

          # Use OCP cluster path for ocp, k3s path for k3s
          if [ "$CLUSTER_TYPE" = "ocp" ]; then
            CLUSTER_NAME="ocp-ai-sno-2"
          else
            CLUSTER_NAME="dasmlab-prod-1"
          fi
          
          DEPLOY_DIR="dasmlab-live-cicd/clusters/${CLUSTER_NAME}/dasmlab-home/live"
          ARCHIVE_DIR="dasmlab-live-cicd/clusters/${CLUSTER_NAME}/dasmlab-home/archived"
          mkdir -p "$ARCHIVE_DIR"
          mkdir -p "$DEPLOY_DIR"

          # Move ALL old versioned manifests into archive BEFORE adding new one
          # This ensures only one manifest exists in live directory at any time
          if [ -d "$DEPLOY_DIR" ]; then
            find "$DEPLOY_DIR" -maxdepth 1 -type f -name 'dasmlab-home-v*.yaml' -print0 | while IFS= read -r -d '' file; do
              if [ -f "$file" ]; then
                echo "Archiving old manifest: $(basename "$file")"
                mv "$file" "$ARCHIVE_DIR/"
              fi
            done
          fi

          # Save only new versioned file (Flux/ArgoCD watches this)
          cp generated.yaml "$DEPLOY_DIR/dasmlab-home-${VERSION_TAG}.yaml"
          echo "Created new manifest: dasmlab-home-${VERSION_TAG}.yaml"

          cd dasmlab-live-cicd
          git add .
          git commit -m "Auto-publish dasmlab-home ${VERSION_TAG} (${CLUSTER_TYPE})"
          git push

      - name: Teardown (Cleanup)
        if: always()
        run: |
          # Clean up buildah containers and temp files
          buildah rm -a 2>/dev/null || true
          rm -rf ~/.docker ~/.local/share/containers 2>/dev/null || true

  auto-merge-to-main:
    name: Auto merge passing branch to main
    needs: cx-pipeline
    if: github.ref == 'refs/heads/2026-spring-FE-update' || github.ref == 'refs/heads/development'
    runs-on: [self-hosted, Linux, X64, k8s-runner]
    permissions:
      contents: write
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge successful commit into main
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "Auto-merge source branch: ${SOURCE_BRANCH}"
          git fetch origin main "${SOURCE_BRANCH}"
          git checkout main
          git merge --no-ff --no-edit "origin/${SOURCE_BRANCH}"
          git push origin main
