name: Dasmlab Home CX Pipeline (Isolated Builds with Buildah/Podman)

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      cluster_type:
        description: 'Cluster type (ocp or k3s)'
        required: false
        default: 'ocp'
        type: choice
        options:
          - ocp
          - k3s

jobs:
  cx-pipeline:
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Build Metadata
        id: vars
        run: |
          echo "COMMIT_ID=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "VERSION_TAG=v$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "NETWORK_NAME=dasmlab-net-${GITHUB_SHA::8}" >> $GITHUB_ENV
          echo "IMAGE_TAG=dasmlab-home_image:${GITHUB_SHA::8}" >> $GITHUB_ENV
          echo "CONTAINER_NAME=dasmlab-home_instance-${GITHUB_SHA::8}" >> $GITHUB_ENV
          echo "COUNTER_FULL_PATH=${{ vars.COUNTER_FULL_PATH }}" >> $GITHUB_ENV
          echo "COUNTER_API_TOKEN=${{ vars.COUNTER_API_TOKEN }}" >> $GITHUB_ENV
          echo "COUNTER_COUNTER_SLUG=${{ vars.COUNTER_COUNTER_SLUG }}" >> $GITHUB_ENV
          echo "COUNTER_WORKSPACE=${{ vars.WORKSPACE }}" >> $GITHUB_ENV

      - name: Install Buildah and Podman
        run: |
          # Install buildah and podman (daemonless container tools)
          if ! command -v buildah &> /dev/null; then
            echo "Installing buildah and podman..."
            # For Debian/Ubuntu
            if [ -f /etc/debian_version ]; then
              sudo apt-get update
              sudo apt-get install -y buildah podman
            # For RHEL/CentOS/Fedora
            elif [ -f /etc/redhat-release ]; then
              sudo dnf install -y buildah podman || sudo yum install -y buildah podman
            # For Alpine
            elif [ -f /etc/alpine-release ]; then
              sudo apk add --no-cache buildah podman
            else
              echo "Unsupported OS, trying to install via package manager..."
              exit 1
            fi
          fi
          buildah --version
          podman --version

      - name: Build Phase
        run: |
          buildah build \
            --build-arg COUNTER_FULL_PATH="$COUNTER_FULL_PATH" \
            --build-arg COUNTER_API_TOKEN="$COUNTER_API_TOKEN" \
            --build-arg COUNTER_COUNTER_SLUG="$COUNTER_COUNTER_SLUG" \
            --build-arg COUNTER_WORKSPACE="$COUNTER_WORKSPACE" \
            --build-arg APP_VERSION="$VERSION_TAG" \
            --tag $IMAGE_TAG \
            .

      - name: Create Isolated Podman Network
        run: |
          podman network create $NETWORK_NAME || true

      - name: Run Phase (App Container)
        run: |
          podman rm -f $CONTAINER_NAME 2>/dev/null || true
          podman run -d --name $CONTAINER_NAME --network $NETWORK_NAME $IMAGE_TAG
          sleep 5
          podman exec $CONTAINER_NAME curl -f http://localhost:80 || (echo "App failed health check" && exit 1)

      - name: Secure Phase (Stub)
        run: |
          echo "Run SAST/DAST tools here using $CONTAINER_NAME on $NETWORK_NAME"
          # podman run --rm --network $NETWORK_NAME dasmlab-security-suite:latest
          exit 0

      - name: Test Phase (Stub)
        run: |
          echo "Run Selenium/Playwright/etc against $CONTAINER_NAME on $NETWORK_NAME"
          # podman run --rm --network $NETWORK_NAME dasmlab-test-suite:latest
          exit 0

      - name: Publish Phase
        run: |
          # Login to GHCR using buildah
          echo "${{ secrets.DASMLAB_GHCR_PAT }}" | buildah login --username lmcdasm --password-stdin ghcr.io
          
          # Tag the image
          buildah tag $IMAGE_TAG ghcr.io/lmcdasm/dasmlab-home:${VERSION_TAG}
          
          # Push the image
          buildah push ghcr.io/lmcdasm/dasmlab-home:${VERSION_TAG}

      - name: GitOps Sync (Deploy) Phase
        env:
          # Default to 'ocp' since cluster is now OpenShift
          # Can override via workflow_dispatch input if needed
          CLUSTER_TYPE: ${{ inputs.cluster_type || 'ocp' }}
        run: |
          # Determine which manifest to use based on CLUSTER_TYPE (default: ocp)
          # Can be set via workflow_dispatch input or environment variable
          if [ "$CLUSTER_TYPE" = "ocp" ]; then
            MANIFEST_SOURCE="k8s_envelope/dasmlab-home_deploy-ocp.yaml"
            echo "Using OCP manifest for OpenShift deployment"
          else
            MANIFEST_SOURCE="k8s_envelope/dasmlab-home_deploy.yaml"
            echo "Using k3s manifest for k3s deployment"
          fi
          
          sed "s|__VERSION__|${VERSION_TAG}|g" "$MANIFEST_SOURCE" > generated.yaml

          git config --global user.name "dasmlab-bot"
          git config --global user.email "ci@dasmlab.org"

          git clone https://x-access-token:${{ secrets.DASMLAB_GHCR_PAT }}@github.com/lmcdasm/dasmlab-live-cicd.git

          # Use OCP cluster path for ocp, k3s path for k3s
          if [ "$CLUSTER_TYPE" = "ocp" ]; then
            CLUSTER_NAME="ocp-ai-sno-2"
          else
            CLUSTER_NAME="dasmlab-prod-1"
          fi
          
          DEPLOY_DIR="dasmlab-live-cicd/clusters/${CLUSTER_NAME}/dasmlab-home/live"
          ARCHIVE_DIR="dasmlab-live-cicd/clusters/${CLUSTER_NAME}/dasmlab-home/archived"
          mkdir -p "$ARCHIVE_DIR"

          # Move all old versioned manifests into archive (just keep latest clean)
          find "$DEPLOY_DIR" -maxdepth 1 -type f -name 'dasmlab-home-v*.yaml' -exec mv {} "$ARCHIVE_DIR"/ \;

          # Save only new versioned file (Flux/ArgoCD watches this)
          cp generated.yaml "$DEPLOY_DIR/dasmlab-home-${VERSION_TAG}.yaml"

          cd dasmlab-live-cicd
          git add .
          git commit -m "Auto-publish dasmlab-home ${VERSION_TAG} (${CLUSTER_TYPE})"
          git push

      - name: Teardown (Clean Containers & Network)
        if: always()
        run: |
          podman rm -f $CONTAINER_NAME || true
          podman network rm $NETWORK_NAME || true
          # Clean up buildah images to save space
          buildah rmi $IMAGE_TAG 2>/dev/null || true
