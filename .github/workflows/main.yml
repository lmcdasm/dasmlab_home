name: Dasmlab Home CX Pipeline

on:
  push:
    branches:
      - main
      - development
      - "2026-spring-FE-update"
      - "2026-lab-constellation"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      cluster_type:
        description: "Cluster type for prod publish (ocp or k3s)"
        required: false
        default: "ocp"
        type: choice
        options: [ocp, k3s]
      force_preview:
        description: "Force preview deploy even on main"
        required: false
        default: false
        type: boolean

concurrency:
  group: dasmlab-home-${{ github.ref == 'refs/heads/main' && 'prod' || format('preview-{0}', github.actor) }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: [self-hosted]
    outputs:
      version_tag: ${{ steps.meta.outputs.version_tag }}
      is_prod: ${{ steps.meta.outputs.is_prod }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          set -euo pipefail
          TAG="v$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)"
          IS_PROD=false
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ inputs.force_preview || false }}" != "true" ]; then
            IS_PROD=true
          fi
          echo "version_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "is_prod=${IS_PROD}" >> "$GITHUB_OUTPUT"
          echo "VERSION_TAG=${TAG} is_prod=${IS_PROD}"

  build-publish:
    needs: prepare
    permissions:
      contents: read
      packages: write
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Metadata
        id: vars
        run: |
          echo "COMMIT_ID=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "VERSION_TAG=${{ needs.prepare.outputs.version_tag }}" >> $GITHUB_ENV
          echo "COUNTER_FULL_PATH=${{ vars.COUNTER_FULL_PATH }}" >> $GITHUB_ENV
          echo "COUNTER_API_TOKEN=${{ vars.COUNTER_API_TOKEN }}" >> $GITHUB_ENV
          echo "COUNTER_COUNTER_SLUG=${{ vars.COUNTER_COUNTER_SLUG }}" >> $GITHUB_ENV
          echo "COUNTER_WORKSPACE=${{ vars.WORKSPACE }}" >> $GITHUB_ENV

      - name: Verify Container Builder
        run: |
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:${PATH}"
          if command -v buildah &> /dev/null; then
            echo "BUILDER_RUNTIME=buildah" >> $GITHUB_ENV
            buildah --version
          elif [ -x "/kaniko/executor" ]; then
            echo "BUILDER_RUNTIME=kaniko" >> $GITHUB_ENV
            /kaniko/executor version
          else
            echo "ERROR: No supported container builder found (buildah or kaniko)"
            exit 1
          fi

      - name: Build Phase
        env:
          GHCR_TOKEN: ${{ secrets.DASMLAB_GHCR_PAT }}
        run: |
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:${PATH}"
          export BUILDAH_ISOLATION=chroot
          export STORAGE_DRIVER=vfs
          export XDG_RUNTIME_DIR="/tmp/xdg-runtime-${GITHUB_RUN_ID}"
          mkdir -p "${XDG_RUNTIME_DIR}"

          buildah rm -a 2>/dev/null || true
          rm -rf ~/.local/share/containers/storage/vfs/dir/* 2>/dev/null || true

          if [ "${BUILDER_RUNTIME}" = "buildah" ]; then
            export BUILDAH_RUNROOT="/tmp/buildah-runroot-${GITHUB_RUN_ID}"
            export BUILDAH_GRAPHROOT="/tmp/buildah-graphroot-${GITHUB_RUN_ID}"
            mkdir -p "${BUILDAH_RUNROOT}" "${BUILDAH_GRAPHROOT}"
            echo "BUILDAH_RUNROOT=${BUILDAH_RUNROOT}" >> $GITHUB_ENV
            echo "BUILDAH_GRAPHROOT=${BUILDAH_GRAPHROOT}" >> $GITHUB_ENV
            export CONTAINERS_STORAGE_CONF="/tmp/containers-storage-${GITHUB_RUN_ID}.conf"
            printf '%s\n' \
              '[storage]' \
              'driver = "vfs"' \
              "runroot = \"${BUILDAH_RUNROOT}\"" \
              "graphroot = \"${BUILDAH_GRAPHROOT}\"" \
              > "${CONTAINERS_STORAGE_CONF}"
          fi

          if [ -z "${GHCR_TOKEN}" ] && [ -f "/home/dasm/gh-pat" ]; then
            # shellcheck disable=SC1091
            source /home/dasm/gh-pat
            GHCR_TOKEN="${DASMLAB_GHCR_PAT:-${GH_TOKEN:-}}"
          fi
          if [ -z "${GHCR_TOKEN}" ] && [ -f "/home/dasm/gh_token" ]; then
            GHCR_TOKEN="$(tr -d '\n\r' < /home/dasm/gh_token)"
          fi
          if [ -z "${GHCR_TOKEN}" ]; then
            echo "ERROR: GHCR_TOKEN is not set!"
            exit 1
          fi

          if [ "${BUILDER_RUNTIME}" = "buildah" ]; then
            buildah_cmd() {
              buildah \
                --storage-driver="${STORAGE_DRIVER}" \
                --root "${BUILDAH_GRAPHROOT:-$HOME/.local/share/containers/storage}" \
                --runroot "${BUILDAH_RUNROOT:-/tmp/containers-user-$UID/containers}" \
                "$@"
            }

            echo "${GHCR_TOKEN}" | buildah_cmd login --username lmcdasm --password-stdin ghcr.io
            echo "::add-mask::${GHCR_TOKEN}"
            echo "DEPLOY_TOKEN=${GHCR_TOKEN}" >> $GITHUB_ENV

            buildah_cmd build \
              --build-arg COUNTER_FULL_PATH="$COUNTER_FULL_PATH" \
              --build-arg COUNTER_API_TOKEN="$COUNTER_API_TOKEN" \
              --build-arg COUNTER_COUNTER_SLUG="$COUNTER_COUNTER_SLUG" \
              --build-arg COUNTER_WORKSPACE="$COUNTER_WORKSPACE" \
              --build-arg APP_VERSION="$VERSION_TAG" \
              -t "ghcr.io/lmcdasm/dasmlab-home:${VERSION_TAG}" \
              -f Dockerfile \
              .
            buildah_cmd push "ghcr.io/lmcdasm/dasmlab-home:${VERSION_TAG}"
          else
            echo "::add-mask::${GHCR_TOKEN}"
            echo "DEPLOY_TOKEN=${GHCR_TOKEN}" >> $GITHUB_ENV
            SUDO_CMD=""
            if command -v sudo >/dev/null 2>&1; then
              SUDO_CMD="sudo -E"
            fi
            ${SUDO_CMD} mkdir -p /kaniko/.docker
            AUTH_B64=$(printf "lmcdasm:%s" "${GHCR_TOKEN}" | base64 -w 0)
            printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "${AUTH_B64}" | ${SUDO_CMD} tee /kaniko/.docker/config.json >/dev/null
            ${SUDO_CMD} /kaniko/executor \
              --context "${GITHUB_WORKSPACE}" \
              --dockerfile "${GITHUB_WORKSPACE}/Dockerfile" \
              --destination "ghcr.io/lmcdasm/dasmlab-home:${VERSION_TAG}" \
              --build-arg COUNTER_FULL_PATH="$COUNTER_FULL_PATH" \
              --build-arg COUNTER_API_TOKEN="$COUNTER_API_TOKEN" \
              --build-arg COUNTER_COUNTER_SLUG="$COUNTER_COUNTER_SLUG" \
              --build-arg COUNTER_WORKSPACE="$COUNTER_WORKSPACE" \
              --build-arg APP_VERSION="$VERSION_TAG"
          fi

      - name: Teardown (Cleanup)
        if: always()
        run: |
          if [ -n "${BUILDAH_GRAPHROOT:-}" ] && [ -n "${BUILDAH_RUNROOT:-}" ]; then
            buildah --storage-driver=vfs --root "${BUILDAH_GRAPHROOT}" --runroot "${BUILDAH_RUNROOT}" rm -a 2>/dev/null || true
            rm -rf "${BUILDAH_RUNROOT}" "${BUILDAH_GRAPHROOT}" 2>/dev/null || true
          fi

  preview-deploy:
    needs: [prepare, build-publish]
    if: success() && needs.prepare.outputs.is_prod != 'true'
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy developer preview
        env:
          VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
          PREVIEW_ACTOR: ${{ github.actor }}
          DASMLAB_GHCR_PAT: ${{ secrets.DASMLAB_GHCR_PAT }}
        run: |
          set -euo pipefail
          chmod +x scripts/ci/*.sh
          ./scripts/ci/deploy-preview.sh

  prod-gitops:
    needs: [prepare, build-publish]
    if: success() && needs.prepare.outputs.is_prod == 'true'
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - name: GitOps Sync (prod)
        env:
          CLUSTER_TYPE: ${{ inputs.cluster_type || 'ocp' }}
          VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
          DASMLAB_GHCR_PAT: ${{ secrets.DASMLAB_GHCR_PAT }}
        run: |
          set -euo pipefail
          DEPLOY_TOKEN="${DASMLAB_GHCR_PAT:-}"
          if [ -z "${DEPLOY_TOKEN}" ] && [ -f "/home/dasm/gh_token" ]; then
            DEPLOY_TOKEN="$(tr -d '\n\r' < /home/dasm/gh_token)"
          fi
          if [ -z "${DEPLOY_TOKEN}" ] && [ -f "/home/dasm/gh-pat" ]; then
            # shellcheck disable=SC1091
            source /home/dasm/gh-pat
            DEPLOY_TOKEN="${DASMLAB_GHCR_PAT:-${GH_TOKEN:-}}"
          fi
          if [ -z "${DEPLOY_TOKEN}" ]; then
            echo "ERROR: DEPLOY_TOKEN is not set!"
            exit 1
          fi

          if [ "$CLUSTER_TYPE" = "ocp" ]; then
            MANIFEST_SOURCE="k8s_envelope/dasmlab-home_deploy-ocp.yaml"
            TARGET_CLUSTERS=("2026-prod-2-1" "2026-prod-1")
          else
            MANIFEST_SOURCE="k8s_envelope/dasmlab-home_deploy.yaml"
            TARGET_CLUSTERS=("dasmlab-prod-1")
          fi

          sed "s|__VERSION__|${VERSION_TAG}|g" "$MANIFEST_SOURCE" > generated.yaml
          git clone "https://x-access-token:${DEPLOY_TOKEN}@github.com/lmcdasm/dasmlab-live-cicd.git"

          for CLUSTER_NAME in "${TARGET_CLUSTERS[@]}"; do
            DEPLOY_DIR="dasmlab-live-cicd/clusters/${CLUSTER_NAME}/dasmlab-home/live"
            ARCHIVE_DIR="dasmlab-live-cicd/clusters/${CLUSTER_NAME}/dasmlab-home/archived"
            mkdir -p "$ARCHIVE_DIR" "$DEPLOY_DIR"
            if [ -d "$DEPLOY_DIR" ]; then
              find "$DEPLOY_DIR" -maxdepth 1 -type f -name 'dasmlab-home-v*.yaml' -print0 | while IFS= read -r -d '' file; do
                mv "$file" "$ARCHIVE_DIR/"
              done
            fi
            cp generated.yaml "$DEPLOY_DIR/dasmlab-home-${VERSION_TAG}.yaml"
          done

          cd dasmlab-live-cicd
          git config user.name "dasmlab-bot"
          git config user.email "ci@dasmlab.org"
          git add .
          if git diff --cached --quiet; then
            echo "No GitOps changes"
            exit 0
          fi
          git commit -m "Auto-publish dasmlab-home ${VERSION_TAG} (${CLUSTER_TYPE})"
          git push
