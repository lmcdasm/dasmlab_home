apiVersion: apps/v1
kind: Deployment
metadata:
  name: dasmlab-home
  namespace: dasmlab-home-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dasmlab-home
  template:
    metadata:
      labels:
        app: dasmlab-home
    spec:
      serviceAccountName: dasmlab-home-sa
      imagePullSecrets:
      - name: dasmlab-ghcr-pull
      containers:
        - name: dasmlab-home
          image: ghcr.io/lmcdasm/dasmlab-home:__VERSION__
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          volumeMounts:
          - name: nginx-cache
            mountPath: /var/cache/nginx
          - name: nginx-run
            mountPath: /var/run
      volumes:
      - name: nginx-cache
        emptyDir: {}
      - name: nginx-run
        emptyDir: {}

---

apiVersion: v1
kind: Service
metadata:
  name: dasmlab-home
  namespace: dasmlab-home-system
spec:
  selector:
    app: dasmlab-home
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http  # Matches named container port (80)
      protocol: TCP

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: dasmlab-home
  namespace: dasmlab-home-system
spec:
  host: dasmlab.org
  to:
    kind: Service
    name: dasmlab-home
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None

